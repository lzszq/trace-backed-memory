name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: python -m pytest

  reducer-determinism:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Verify the canonical projection golden digest
        run: python tools/verify_projection_determinism.py

  quality:
    runs-on: ubuntu-latest
    env:
      TBM_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/typescript-sdk/package-lock.json
      - name: Install PostgreSQL server tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client
          POSTGRES_BIN="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -n "$POSTGRES_BIN"
          echo "$POSTGRES_BIN" >> "$GITHUB_PATH"
      - run: python -m venv .quality
      - run: .quality/bin/python -m pip install --upgrade pip
      - run: .quality/bin/python -m pip install ".[dev]"
      - run: npm ci --ignore-scripts
        working-directory: packages/typescript-sdk
      - name: Verify required PostgreSQL runtime
        run: |
          initdb --version
          pg_ctl --version
          psql --version
          .quality/bin/python -c "import psycopg; print(psycopg.__version__)"
      - name: Run unified full-repository verification
        run: .quality/bin/python tools/verify.py --all
      - name: Audit installed dependencies
        run: |
          .quality/bin/python -m pip freeze \
            --exclude trace-backed-memory > .quality/audit-requirements.txt
          .quality/bin/python -m pip_audit \
            --strict --no-deps -r .quality/audit-requirements.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/typescript-sdk/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: npm ci --ignore-scripts
        working-directory: packages/typescript-sdk
      - run: npm run check
        working-directory: packages/typescript-sdk
      - run: npm test
        working-directory: packages/typescript-sdk
      - run: npm run pack:check
        working-directory: packages/typescript-sdk

  postgres:
    runs-on: ubuntu-latest
    env:
      TBM_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install PostgreSQL server tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client
          POSTGRES_BIN="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -n "$POSTGRES_BIN"
          echo "$POSTGRES_BIN" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify required PostgreSQL runtime
        run: |
          initdb --version
          pg_ctl --version
          psql --version
          python -c "import psycopg; print(psycopg.__version__)"
      - name: Run required PostgreSQL tests
        run: >-
          python -m pytest
          tests/test_postgres_integration.py
          tests/test_postgres_repository.py
          tests/test_postgres_outcome_attribution_v3.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip "build>=1.2,<2"
      - run: python -m build
      - name: Verify build artifacts
        run: python tests/verify_distribution.py dist
      - name: Install wheel in an isolated environment
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)])"
      - name: Smoke-test installed CLI entry points
        run: |
          .package-smoke/bin/python -c "import json; from importlib.resources import files; from pathlib import Path; from trace_backed_memory import load_failure_taxonomy, packaged_resources; expected=len(json.loads(Path('resources/manifest.json').read_text())['resources']); assert len(packaged_resources()) == expected; assert 'invalid_tool_argument' in load_failure_taxonomy(); assert files('trace_backed_memory').joinpath('py.typed').is_file()"
          .package-smoke/bin/python -c "import trace_backed_memory as tbm; from trace_backed_memory import lifecycle, obsolete_project_policy; assert obsolete_project_policy is lifecycle.obsolete_project_policy; assert 'obsolete_project_policy' in tbm.__all__"
          .package-smoke/bin/tbm capabilities
          .package-smoke/bin/tbm resource list
          .package-smoke/bin/tbm resource export schemas/postgres.sql dist/postgres.wheel.sql
          cmp schemas/postgres.sql dist/postgres.wheel.sql
          .package-smoke/bin/python -c "from trace_backed_memory import TraceBackedMemoryStore; TraceBackedMemoryStore().save_json('dist/empty.snapshot.json')"
          .package-smoke/bin/python -c "from trace_backed_memory.mcp_entry import main; assert main([]) == 2"
          .package-smoke/bin/tbm snapshot validate dist/empty.snapshot.json
          .package-smoke/bin/python -m trace_backed_memory snapshot stats dist/empty.snapshot.json
          .package-smoke/bin/python - <<'PY'
          from trace_backed_memory import FailureCase, Lesson, ProjectPolicy, Trace, TraceBackedMemoryStore

          store = TraceBackedMemoryStore()
          trace = store.record_trace(Trace(trace_id="trace_lessons_smoke", run_id="run_lessons_smoke", commit_sha="commit_package_smoke", repo="repo_package_smoke", eval_result="fail"))
          case = store.add_failure_case(FailureCase(case_id="case_lessons_smoke", source_trace_id=trace.trace_id, commit_sha=trace.commit_sha, failure_type="executor_failure", symptom="executor timed out", root_cause="executor runtime was unbounded", reviewed_by="package-smoke", reviewed_at="2026-07-25T00:00:00Z", fix="bound executor runtime", fix_commit_sha="fix_package_smoke", regression_passed=True, status="verified"))
          store.save_json("dist/lessons-target-wheel.snapshot.json")
          store.save_json("dist/lessons-target-sdist.snapshot.json")
          store.add_lesson(Lesson(lesson_id="lesson_package_smoke", source_case_id=case.case_id, lesson_text="Bound executor runtime before retrying.", memory_type="procedural", scope={"repo": trace.repo}))
          store.add_lesson(Lesson(lesson_id="lesson_package_obsolete", source_case_id=case.case_id, lesson_text="Retry immediately.", memory_type="procedural", scope={"repo": trace.repo}, status="obsolete"))
          store.add_project_policy(ProjectPolicy(policy_id="policy_package_smoke", policy_text="Record executor timeout evidence.", scope={"repo": trace.repo}))
          store.save_json("dist/lessons-source.snapshot.json")
          store.save_json("dist/obsolete-wheel.snapshot.json")
          store.save_json("dist/obsolete-sdist.snapshot.json")
          store.save_json("dist/obsolete-batch-wheel.snapshot.json")
          store.save_json("dist/obsolete-batch-sdist.snapshot.json")
          PY
          .package-smoke/bin/tbm lessons export dist/lessons-source.snapshot.json dist/lessons.wheel.yaml > dist/lessons-export.wheel.json
          .package-smoke/bin/tbm lessons import dist/lessons-target-wheel.snapshot.json dist/lessons.wheel.yaml --write > dist/lessons-import.wheel.json
          .package-smoke/bin/python -c "import json; from pathlib import Path; from trace_backed_memory import TraceBackedMemoryStore; exported = json.loads(Path('dist/lessons-export.wheel.json').read_text()); imported = json.loads(Path('dist/lessons-import.wheel.json').read_text()); assert exported['exported_lesson_ids'] == ['lesson_package_smoke']; assert imported['written'] is True; assert list(TraceBackedMemoryStore.load_json('dist/lessons-target-wheel.snapshot.json').lessons) == ['lesson_package_smoke']; assert b'lesson_package_obsolete' not in Path('dist/lessons.wheel.yaml').read_bytes()"
          .package-smoke/bin/tbm obsolete dist/obsolete-wheel.snapshot.json failure-case case_lessons_smoke --write > dist/obsolete.wheel.json
          .package-smoke/bin/python -c "import json; from pathlib import Path; from trace_backed_memory import TraceBackedMemoryStore; payload = json.loads(Path('dist/obsolete.wheel.json').read_text()); store = TraceBackedMemoryStore.load_json('dist/obsolete-wheel.snapshot.json'); assert payload['cascaded_lesson_ids'] == ['lesson_package_smoke']; assert payload['written'] is True; assert store.failure_cases['case_lessons_smoke'].status == 'obsolete'; assert store.lessons['lesson_package_smoke'].status == 'obsolete'"
          .package-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path

          context = {
              "mode": "regression",
              "repo": "repo_package_smoke",
              "commit_sha": "commit_package_smoke",
              "model": "model-new",
          }
          change_set = {
              "field_changes": [{
                  "field_name": "model",
                  "old_value": "model-old",
                  "new_value": "model-new",
              }]
          }
          Path("dist/pr-context.json").write_text(json.dumps(context), encoding="utf-8")
          Path("dist/pr-change-set.json").write_text(json.dumps(change_set), encoding="utf-8")
          Path("dist/obsolete-batch-wheel.json").write_text(json.dumps([{"memory_kind": "failure_case", "memory_id": "case_lessons_smoke"}, {"memory_kind": "project_policy", "memory_id": "policy_package_smoke"}]), encoding="utf-8")
          Path("dist/obsolete-batch-sdist.json").write_text(json.dumps([{"memory_kind": "failure_case", "memory_id": "case_lessons_smoke"}, {"memory_kind": "lesson", "memory_id": "lesson_package_smoke"}]), encoding="utf-8")
          PY
          .package-smoke/bin/tbm obsolete-batch dist/obsolete-batch-wheel.snapshot.json dist/obsolete-batch-wheel.json --write > dist/obsolete-batch.wheel.json
          .package-smoke/bin/python -c "import json; from pathlib import Path; from trace_backed_memory import TraceBackedMemoryStore; payload = json.loads(Path('dist/obsolete-batch.wheel.json').read_text()); store = TraceBackedMemoryStore.load_json('dist/obsolete-batch-wheel.snapshot.json'); assert payload['affected_count'] == 3; assert payload['changed_count'] == 2; assert payload['cascaded_lesson_ids'] == ['lesson_package_smoke']; assert payload['written'] is True; assert store.failure_cases['case_lessons_smoke'].status == 'obsolete'; assert store.project_policies['policy_package_smoke'].status == 'obsolete'"
          .package-smoke/bin/tbm pr-report dist/empty.snapshot.json dist/pr-context.json dist/pr-change-set.json --repo-path . > dist/pr-report.wheel.json
          .package-smoke/bin/python -c "import json; from pathlib import Path; payload = json.loads(Path('dist/pr-report.wheel.json').read_text()); assert payload['commit_ancestry']['commit_relations'] == []; assert payload['report']['related_case_ids'] == []"
          DECISION_ID=$(.package-smoke/bin/python -c "from trace_backed_memory import MemoryContext, MemoryDecision, Trace, TraceBackedMemoryStore; store = TraceBackedMemoryStore(); trace = store.record_trace(Trace(trace_id='trace_package_smoke', run_id='run_package_smoke', commit_sha='commit_package_smoke', repo='repo_package_smoke')); log = store.log_decision(trace.run_id, MemoryContext(mode='repair', repo='repo_package_smoke', commit_sha=trace.commit_sha), [], MemoryDecision(use_memory=False, allowed_memory_ids=[], blocked_memory_ids=[], reason='no applicable memory', risk='none', recommended_injection='none')); store.save_json('dist/pending.snapshot.json'); store.save_json('dist/outcome-wheel.snapshot.json'); print(log.decision_id)")
          .package-smoke/bin/tbm outcome dist/outcome-wheel.snapshot.json "$DECISION_ID" --eval-result pass --write > dist/outcome.wheel.json
          .package-smoke/bin/python -c "import json; from pathlib import Path; from trace_backed_memory import TraceBackedMemoryStore; payload = json.loads(Path('dist/outcome.wheel.json').read_text()); before = TraceBackedMemoryStore.load_json('dist/pending.snapshot.json'); store = TraceBackedMemoryStore.load_json('dist/outcome-wheel.snapshot.json'); logs = {log.decision_id: log for log in store.usage_logs}; assert set(payload) == {'changed', 'decision_id', 'eval_result', 'memory_caused_failure', 'previous_eval_result', 'previous_memory_caused_failure', 'written'}; assert payload['changed'] is True; assert payload['written'] is True; assert payload['decision_id'] == '$DECISION_ID'; assert logs[payload['decision_id']].eval_result == 'pass'; assert store.traces == before.traces"
          .package-smoke/bin/tbm complete dist/pending.snapshot.json trace_package_smoke "$DECISION_ID" --eval-result pass --write
          .package-smoke/bin/python -c "from trace_backed_memory import TraceBackedMemoryStore; store = TraceBackedMemoryStore.load_json('dist/pending.snapshot.json'); assert store.memory_run_audits()[0].status == 'complete'"
          .package-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path
          from trace_backed_memory import MemoryContext, MemoryDecision, Trace, TraceBackedMemoryStore

          store = TraceBackedMemoryStore()
          measurements = []
          for index, eval_result in enumerate(("pass", "error"), start=1):
              trace = store.record_trace(Trace(trace_id=f"trace_batch_smoke_{index}", run_id=f"run_batch_smoke_{index}", commit_sha="commit_package_smoke", repo="repo_package_smoke"))
              log = store.log_decision(trace.run_id, MemoryContext(mode="repair", repo=trace.repo, commit_sha=trace.commit_sha), [], MemoryDecision(use_memory=False, allowed_memory_ids=[], blocked_memory_ids=[], reason="no applicable memory", risk="none", recommended_injection="none"))
              measurements.append({"decision_id": log.decision_id, "eval_result": eval_result})
          store.save_json("dist/pending-batch-wheel.snapshot.json")
          store.save_json("dist/pending-batch-sdist.snapshot.json")
          Path("dist/measurements.json").write_text(json.dumps(measurements), encoding="utf-8")
          PY
          .package-smoke/bin/tbm complete-batch dist/pending-batch-wheel.snapshot.json dist/measurements.json --write
          .package-smoke/bin/python -c "from trace_backed_memory import TraceBackedMemoryStore; store = TraceBackedMemoryStore.load_json('dist/pending-batch-wheel.snapshot.json'); assert [item.status for item in store.memory_run_audits()] == ['complete', 'complete']"
      - name: Install and smoke-test source distribution
        run: |
          python -m venv .sdist-smoke
          .sdist-smoke/bin/python -c "from pathlib import Path; import subprocess, sys; sdist = next(Path('dist').glob('*.tar.gz')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(sdist)])"
          .sdist-smoke/bin/python -c "import json; from importlib.resources import files; from pathlib import Path; from trace_backed_memory import load_failure_taxonomy, packaged_resources; expected=len(json.loads(Path('resources/manifest.json').read_text())['resources']); assert len(packaged_resources()) == expected; assert 'invalid_tool_argument' in load_failure_taxonomy(); assert files('trace_backed_memory').joinpath('py.typed').is_file()"
          .sdist-smoke/bin/python -c "import trace_backed_memory as tbm; from trace_backed_memory import lifecycle, obsolete_project_policy; assert obsolete_project_policy is lifecycle.obsolete_project_policy; assert 'obsolete_project_policy' in tbm.__all__"
          .sdist-smoke/bin/tbm capabilities
          .sdist-smoke/bin/tbm resource export schemas/postgres.sql dist/postgres.sdist.sql
          cmp schemas/postgres.sql dist/postgres.sdist.sql
          .sdist-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path
          from trace_backed_memory import FailureCase, Lesson, MemoryContext, MemoryDecision, ProjectPolicy, Trace, TraceBackedMemoryStore

          root = Path("dist/sdist-fixtures")
          root.mkdir()
          TraceBackedMemoryStore().save_json(root / "empty.snapshot.json")

          store = TraceBackedMemoryStore()
          trace = store.record_trace(Trace(trace_id="trace_sdist_smoke", run_id="run_sdist_smoke", commit_sha="commit_sdist_smoke", repo="repo_sdist_smoke", eval_result="fail"))
          case = store.add_failure_case(FailureCase(case_id="case_sdist_smoke", source_trace_id=trace.trace_id, commit_sha=trace.commit_sha, failure_type="executor_failure", symptom="executor timed out", root_cause="executor runtime was unbounded", reviewed_by="package-smoke", reviewed_at="2026-07-25T00:00:00Z", fix="bound executor runtime", fix_commit_sha="fix_sdist_smoke", regression_passed=True, status="verified"))
          store.save_json(root / "lessons-target.snapshot.json")
          store.add_lesson(Lesson(lesson_id="lesson_sdist_smoke", source_case_id=case.case_id, lesson_text="Bound executor runtime before retrying.", memory_type="procedural", scope={"repo": trace.repo}))
          store.add_lesson(Lesson(lesson_id="lesson_sdist_obsolete", source_case_id=case.case_id, lesson_text="Retry immediately.", memory_type="procedural", scope={"repo": trace.repo}, status="obsolete"))
          store.add_project_policy(ProjectPolicy(policy_id="policy_sdist_smoke", policy_text="Record executor timeout evidence.", scope={"repo": trace.repo}))
          store.save_json(root / "lessons-source.snapshot.json")
          store.save_json(root / "obsolete.snapshot.json")
          store.save_json(root / "obsolete-batch.snapshot.json")
          (root / "obsolete-batch.json").write_text(json.dumps([{"memory_kind": "failure_case", "memory_id": case.case_id}, {"memory_kind": "lesson", "memory_id": "lesson_sdist_smoke"}]), encoding="utf-8")
          (root / "pr-context.json").write_text(json.dumps({"mode": "regression", "repo": "repo_sdist_smoke", "commit_sha": "commit_sdist_smoke"}), encoding="utf-8")
          (root / "pr-change-set.json").write_text(json.dumps({"field_changes": [{"field_name": "model", "old_value": "model-old", "new_value": None}]}), encoding="utf-8")

          pending = TraceBackedMemoryStore()
          measurements = []
          for index, eval_result in enumerate(("pass", "error"), start=1):
              pending_trace = pending.record_trace(Trace(trace_id=f"trace_sdist_batch_{index}", run_id=f"run_sdist_batch_{index}", commit_sha="commit_sdist_smoke", repo="repo_sdist_smoke"))
              log = pending.log_decision(pending_trace.run_id, MemoryContext(mode="repair", repo=pending_trace.repo, commit_sha=pending_trace.commit_sha), [], MemoryDecision(use_memory=False, allowed_memory_ids=[], blocked_memory_ids=[], reason="no applicable memory", risk="none", recommended_injection="none"))
              measurements.append({"decision_id": log.decision_id, "eval_result": eval_result})
          pending.save_json(root / "pending-batch.snapshot.json")
          pending.save_json(root / "outcome.snapshot.json")
          (root / "measurements.json").write_text(json.dumps(measurements), encoding="utf-8")
          (root / "outcome-decision-id.txt").write_text(measurements[0]["decision_id"], encoding="utf-8")
          PY
          .sdist-smoke/bin/python -m trace_backed_memory complete-batch --help
          SDIST_OUTCOME_DECISION_ID=$(cat dist/sdist-fixtures/outcome-decision-id.txt)
          .sdist-smoke/bin/python -m trace_backed_memory outcome dist/sdist-fixtures/outcome.snapshot.json "$SDIST_OUTCOME_DECISION_ID" --eval-result pass --write > dist/sdist-fixtures/outcome.json
          .sdist-smoke/bin/python -c "import json; from pathlib import Path; from trace_backed_memory import TraceBackedMemoryStore; root = Path('dist/sdist-fixtures'); payload = json.loads((root / 'outcome.json').read_text()); before = TraceBackedMemoryStore.load_json(root / 'pending-batch.snapshot.json'); store = TraceBackedMemoryStore.load_json(root / 'outcome.snapshot.json'); logs = {log.decision_id: log for log in store.usage_logs}; assert set(payload) == {'changed', 'decision_id', 'eval_result', 'memory_caused_failure', 'previous_eval_result', 'previous_memory_caused_failure', 'written'}; assert payload['changed'] is True; assert payload['written'] is True; assert payload['decision_id'] == '$SDIST_OUTCOME_DECISION_ID'; assert logs[payload['decision_id']].eval_result == 'pass'; assert store.traces == before.traces"
          .sdist-smoke/bin/python -m trace_backed_memory complete-batch dist/sdist-fixtures/pending-batch.snapshot.json dist/sdist-fixtures/measurements.json --write > dist/sdist-fixtures/complete-batch.json
          .sdist-smoke/bin/python -c "import json; from pathlib import Path; from trace_backed_memory import TraceBackedMemoryStore; root = Path('dist/sdist-fixtures'); payload = json.loads((root / 'complete-batch.json').read_text()); store = TraceBackedMemoryStore.load_json(root / 'pending-batch.snapshot.json'); assert len(payload['completions']) == 2; assert len(payload['decision_ids']) == 2; assert payload['written'] is True; assert [item.status for item in store.memory_run_audits()] == ['complete', 'complete']"
          .sdist-smoke/bin/python -m trace_backed_memory pr-report dist/sdist-fixtures/empty.snapshot.json dist/sdist-fixtures/pr-context.json dist/sdist-fixtures/pr-change-set.json --repo-path . > dist/sdist-fixtures/pr-report.json
          .sdist-smoke/bin/python -c "import json; from pathlib import Path; payload = json.loads(Path('dist/sdist-fixtures/pr-report.json').read_text()); assert payload['commit_ancestry']['commit_relations'] == []; assert payload['report']['related_case_ids'] == []"
          .sdist-smoke/bin/python -m trace_backed_memory lessons export dist/sdist-fixtures/lessons-source.snapshot.json dist/sdist-fixtures/lessons.yaml > dist/sdist-fixtures/lessons-export.json
