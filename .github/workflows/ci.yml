name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip "build>=1.2,<2"
      - run: python -m build
      - name: Verify build artifacts
        run: python tests/verify_distribution.py dist
      - name: Install wheel in an isolated environment
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)])"
      - name: Smoke-test installed CLI entry points
        run: |
          .package-smoke/bin/python -c "from importlib.resources import files; from trace_backed_memory import load_failure_taxonomy, packaged_resources; assert len(packaged_resources()) == 18; assert 'invalid_tool_argument' in load_failure_taxonomy(); assert files('trace_backed_memory').joinpath('py.typed').is_file()"
          .package-smoke/bin/tbm resource list
          .package-smoke/bin/tbm resource export schemas/postgres.sql dist/postgres.wheel.sql
          cmp schemas/postgres.sql dist/postgres.wheel.sql
          .package-smoke/bin/python -c "from trace_backed_memory import TraceBackedMemoryStore; TraceBackedMemoryStore().save_json('dist/empty.snapshot.json')"
          .package-smoke/bin/tbm snapshot validate dist/empty.snapshot.json
          .package-smoke/bin/python -m trace_backed_memory snapshot stats dist/empty.snapshot.json
      - name: Install and smoke-test source distribution
        run: |
          python -m venv .sdist-smoke
          .sdist-smoke/bin/python -c "from pathlib import Path; import subprocess, sys; sdist = next(Path('dist').glob('*.tar.gz')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(sdist)])"
          .sdist-smoke/bin/python -c "from importlib.resources import files; from trace_backed_memory import load_failure_taxonomy, packaged_resources; assert len(packaged_resources()) == 18; assert 'invalid_tool_argument' in load_failure_taxonomy(); assert files('trace_backed_memory').joinpath('py.typed').is_file()"
          .sdist-smoke/bin/tbm resource export schemas/postgres.sql dist/postgres.sdist.sql
          cmp schemas/postgres.sql dist/postgres.sdist.sql
