[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-backed-memory"
version = "0.1.0"
description = "Trace-backed, commit-aware, gated memory for LLM/agent harness engineering."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "lzszq"}]
requires-python = ">=3.11"
dependencies = []
keywords = ["agents", "evaluation", "llm", "memory", "observability", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.scripts]
tbm = "trace_backed_memory.cli:main"
tbm-http = "trace_backed_memory.http_entry:main"
tbm-mcp = "trace_backed_memory.mcp_entry:main"

[project.urls]
Homepage = "https://github.com/lzszq/trace-backed-memory"
Repository = "https://github.com/lzszq/trace-backed-memory"
Issues = "https://github.com/lzszq/trace-backed-memory/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.28.1,<2"]
postgres = ["psycopg>=3.2,<4"]
service = ["pydantic>=2.12,<3"]
dev = [
    "build>=1.2,<2",
    "coverage[toml]>=7.9,<8",
    "mcp>=1.28.1,<2",
    "mypy>=1.16,<2",
    "pip-audit>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "pytest>=8.0.0",
    "ruff>=0.12,<1",
]

